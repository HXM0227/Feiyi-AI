<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17324d" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <title>内容管理 · 非遗 AI</title>
  </head>
  <body class="admin-body">
    <a class="skip-link" href="#adminMain">跳到主要内容</a>
    <header class="site-header admin-header">
      <a class="brand" href="/">
        <span class="brand-mark admin-mark" aria-hidden="true">管</span>
        <span>
          <strong>非遗 AI 内容管理</strong>
          <small>生成、审核、发布与知识入库</small>
        </span>
      </a>
      <a class="secondary-button compact" href="/">返回游客端</a>
    </header>

    <main id="adminMain" class="admin-main">
      <section class="admin-login panel" id="adminLogin">
        <p class="step-label">ADMIN ACCESS</p>
        <h1>连接内容管理后台</h1>
        <p>管理员令牌只保存在当前浏览器会话，不写入页面或日志。</p>
        <form id="loginForm" class="login-row">
          <label class="field grow">
            <span>管理员令牌</span>
            <input id="adminToken" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-button" type="submit">进入后台</button>
        </form>
        <p class="form-message" id="loginMessage" role="alert"></p>
      </section>

      <div id="adminWorkspace" hidden>
        <nav class="admin-tabs" aria-label="后台功能">
          <button class="admin-tab is-active" type="button" data-view="content">
            内容审核
          </button>
          <button class="admin-tab" type="button" data-view="generate">
            生成传播内容
          </button>
          <button class="admin-tab" type="button" data-view="knowledge">
            知识入库
          </button>
          <button class="admin-tab" type="button" id="logoutButton">退出</button>
        </nav>

        <section class="admin-view" data-view-pane="content">
          <div class="admin-section-heading">
            <div>
              <p class="step-label">CONTENT WORKFLOW</p>
              <h2>内容审核与发布</h2>
              <p>状态流转：草稿 → 待审核 → 已批准 → 已发布。</p>
            </div>
            <div class="filter-row">
              <label class="field">
                <span>状态筛选</span>
                <select id="statusFilter">
                  <option value="">全部</option>
                  <option value="draft">草稿</option>
                  <option value="in_review">待审核</option>
                  <option value="approved">已批准</option>
                  <option value="published">已发布</option>
                  <option value="rejected">已驳回</option>
                  <option value="archived">已归档</option>
                </select>
              </label>
              <button class="secondary-button compact" id="refreshContent" type="button">
                刷新
              </button>
            </div>
          </div>
          <div class="content-list" id="contentList"></div>
          <p class="empty-state" id="contentEmpty" hidden>当前没有符合条件的内容。</p>
        </section>

        <section class="admin-view" data-view-pane="generate" hidden>
          <div class="admin-section-heading">
            <div>
              <p class="step-label">GENERATE WITH SOURCES</p>
              <h2>生成传播内容</h2>
              <p>结果自动进入草稿状态，必须经过人工审核才能发布。</p>
            </div>
          </div>
          <form class="panel admin-form" id="generateForm">
            <label class="field full">
              <span>主题</span>
              <textarea
                id="contentTopic"
                rows="3"
                maxlength="500"
                placeholder="例如：向海外社交媒体介绍传统剪纸的寓意"
                required
              ></textarea>
            </label>
            <div class="field-grid">
              <label class="field">
                <span>平台</span>
                <select id="contentPlatform">
                  <option value="social">社交媒体</option>
                  <option value="short_video">短视频脚本</option>
                  <option value="poster">海报文案</option>
                  <option value="event_intro">活动介绍</option>
                </select>
              </label>
              <label class="field">
                <span>目标语言</span>
                <select id="contentLanguage">
                  <option value="zh-CN">中文</option>
                  <option value="en">English</option>
                </select>
              </label>
              <label class="field">
                <span>最大长度</span>
                <input id="contentMaxLength" type="number" min="50" max="5000" value="500" />
              </label>
              <label class="field">
                <span>受众风格</span>
                <select id="contentStyle">
                  <option value="educational">清晰讲解</option>
                  <option value="story">故事化</option>
                  <option value="concise">简洁</option>
                  <option value="academic">专业</option>
                </select>
              </label>
            </div>
            <button class="primary-button" type="submit" id="generateButton">
              生成并保存为草稿
            </button>
            <p class="form-message" id="generateMessage" role="alert"></p>
          </form>
        </section>

        <section class="admin-view" data-view-pane="knowledge" hidden>
          <div class="admin-section-heading">
            <div>
              <p class="step-label">KNOWLEDGE INGEST</p>
              <h2>小批量知识入库</h2>
              <p>资料会通过 T0 进入 T1 清洗，再写入 T3 索引和可选的 T2 图谱。</p>
            </div>
          </div>
          <form class="panel admin-form" id="knowledgeForm">
            <div class="field-grid">
              <label class="field">
                <span>资料 ID</span>
                <input id="sourceId" maxlength="128" placeholder="SRC-001" required />
              </label>
              <label class="field">
                <span>标题</span>
                <input id="sourceTitle" maxlength="300" required />
              </label>
              <label class="field full">
                <span>来源地址</span>
                <input id="sourceUri" placeholder="https://example.org/source" required />
              </label>
              <label class="field">
                <span>资料类型</span>
                <select id="mediaType">
                  <option value="text">文本</option>
                  <option value="document">文档</option>
                  <option value="image">图片</option>
                  <option value="audio">音频</option>
                  <option value="video">视频</option>
                </select>
              </label>
              <label class="field">
                <span>授权状态</span>
                <select id="authorizationStatus">
                  <option value="authorized">已授权</option>
                  <option value="public">公开资料</option>
                  <option value="restricted">受限资料</option>
                  <option value="unknown">待确认</option>
                </select>
              </label>
            </div>
            <label class="switch-label">
              <input id="publishKnowledge" type="checkbox" />
              <span>清洗完成后立即发布到检索索引</span>
            </label>
            <button class="primary-button" type="submit" id="ingestButton">
              提交入库
            </button>
            <p class="form-message" id="knowledgeMessage" role="alert"></p>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="/assets/js/admin.js"></script>
  </body>
</html>
